name: Seed Gradle 8.11.1

on:
  push:
    branches:
      - tooling/seed-gradle-8-11-1
  pull_request:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Gradle distribution
        run: |
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            --output gradle-8.11.1-bin.zip
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256 \
            --output gradle-8.11.1-bin.zip.sha256
          echo "  gradle-8.11.1-bin.zip" >> gradle-8.11.1-bin.zip.sha256
          sha256sum --check gradle-8.11.1-bin.zip.sha256
      - name: Upload verified Gradle distribution
        uses: actions/upload-artifact@v4
        with:
          name: gradle-8.11.1-bin
          path: |
            gradle-8.11.1-bin.zip
            gradle-8.11.1-bin.zip.sha256
          if-no-files-found: error
          retention-days: 1
