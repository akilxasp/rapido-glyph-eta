name: One-off v0.4.4 APK build

on:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Fetch Nothing Glyph Matrix SDK
        run: |
          curl --fail --location \
            https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar \
            --output app/libs/glyph-matrix-sdk-2.0.aar
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Commit temporary APK transfer
        run: |
          mkdir -p build-deliverables
          cp app/build/outputs/apk/debug/app-debug.apk \
            build-deliverables/Rapido-Glyph-ETA-v0.4.4-debug.apk
          base64 -w 0 build-deliverables/Rapido-Glyph-ETA-v0.4.4-debug.apk > /tmp/apk.b64
          split -b 700k -d -a 2 /tmp/apk.b64 build-deliverables/apk.b64.part-
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-deliverables/
          git commit -m "Temporary v0.4.4 APK transfer [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
