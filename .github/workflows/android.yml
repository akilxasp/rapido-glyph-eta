name: Android checks

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build and upload an installable debug APK
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Fetch Nothing Glyph Matrix SDK
        run: |
          curl --fail --location \
            https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar \
            --output app/libs/glyph-matrix-sdk-2.0.aar
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.4.5]')) }}
        run: ./gradlew assembleDebug
      - name: Upload installable APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.4.5]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: rapido-glyph-eta-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish v0.4.5 release
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.4.5]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            Rapido-Glyph-ETA-v0.4.5-debug.apk
          gh release create v0.4.5 \
            Rapido-Glyph-ETA-v0.4.5-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Rapido Glyph ETA v0.4.5" \
            --notes "Promotes Custom Glyph import to the main screen and introduces the new Arrival Arc adaptive launcher icon. Includes the v0.4.4 vertical clock, independent Glyph brightness control, imported resting designs, and Essential Key flicker fix."
