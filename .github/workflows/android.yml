name: Publish v0.4.3 release

on:
  push:
    branches:
      - tooling/seed-gradle-8-11-1

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 30344699212 \
            --repo "$GITHUB_REPOSITORY" \
            --name rapido-glyph-eta-debug \
            --dir release
          mv release/app-debug.apk release/Rapido-Glyph-ETA-v0.4.3-debug.apk
      - name: Verify APK checksum
        run: |
          echo "d71abf568feb31f0de3195587298d73c9bb3170d8e21ac67691b4117539a157e  release/Rapido-Glyph-ETA-v0.4.3-debug.apk" | sha256sum --check
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="release/Rapido-Glyph-ETA-v0.4.3-debug.apk"
          if gh release view v0.4.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.4.3 "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.4.3 "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target 377665db582c8bcdf131a0a9bff2e70ffa4fceba \
              --title "Rapido Glyph ETA v0.4.3" \
              --notes "Debug APK built from the latest PR source. Unit tests and APK archive integrity checks passed. SHA-256: d71abf568feb31f0de3195587298d73c9bb3170d8e21ac67691b4117539a157e"
          fi
