name: Android checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Fetch Nothing Glyph Matrix SDK
        run: |
          curl --fail --location \
            https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar \
            --output app/libs/glyph-matrix-sdk-2.0.aar
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Emit APK for requested transfer
        run: |
          echo "APK_SHA256=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"
          echo "APK_BASE64_BEGIN"
          base64 -w 60000 app/build/outputs/apk/debug/app-debug.apk
          echo "APK_BASE64_END"
