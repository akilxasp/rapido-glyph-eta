name: One-off APK handoff

on:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Fetch Nothing Glyph Matrix SDK
        run: |
          curl --fail --location \
            https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar \
            --output app/libs/glyph-matrix-sdk-2.0.aar
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Commit temporary APK handoff
        run: |
          mkdir -p build-deliverables
          cp app/build/outputs/apk/debug/app-debug.apk \
            build-deliverables/Rapido-Glyph-ETA-v0.4.3-debug.apk
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-deliverables/Rapido-Glyph-ETA-v0.4.3-debug.apk
          git commit -m "Temporary APK handoff [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
