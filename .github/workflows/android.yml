name: One-off APK transfer

on:
  pull_request:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Split APK into temporary text chunks
        run: |
          base64 -w 0 build-deliverables/Rapido-Glyph-ETA-v0.4.3-debug.apk > /tmp/apk.b64
          split -b 700k -d -a 2 /tmp/apk.b64 build-deliverables/apk.b64.part-
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-deliverables/apk.b64.part-*
          git commit -m "Temporary APK transfer chunks [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
